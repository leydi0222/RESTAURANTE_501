{% extends 'gestion/base.html' %}

{% block content %}
<div class="page-header">
    <div class="container-fluid">
        <h1><i class="fas fa-exclamation-triangle"></i> Eliminar {{ tipo }}</h1>
    </div>
</div>

<div class="container-fluid">
    <div class="card p-4">
        <p>¿Estás seguro de que deseas eliminar <strong>{{ objeto }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Eliminar</button>
            <a href="javascript:history.back()" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
